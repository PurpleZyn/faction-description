<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rogue Assembly — redesign draft</title><style>body{margin:0;background:#08070d;color:#eee7f2;font:18px sans-serif}main{max-width:1000px;margin:auto}img{display:block;width:100%;height:auto}a{color:#bb8ddd}nav{text-align:center;padding:30px}</style><main><img src="01-origin.png" width="1000" height="1137" alt="Rogue Assembly: Rogue Assembly rose from Torn’s shadows, forged from loyalty to all. We built a faction where every member matters. Different stories. One Assembly."><img src="02-culture.png" width="1000" height="743" alt="A crew worth logging in for. Torn is a long game. We’re building a faction with people we want alongside us for the journey—people who show up, get involved, and enjoy having a community to come back to. We’re a smaller faction with a core of members who have been here for over a year. Bring your questions, share what you learn, and help when you can. We’re a 19+ community that actively maintains a welcoming space for women and LGBTQ+ players. How you treat people is part of being a Rogue."><img src="03-leadership.png" width="1000" height="1460" alt="The Assembly’s Leadership. Ivory: Recruitment &amp; Discord administration. Sativa: Communications, recruitment &amp; onboarding. Derlin: Operations, organised crimes &amp; resources. Bee: Community, events &amp; faction identity. Purple: War strategy, coordination &amp; diplomacy"><img src="04-vips.png" width="1000" height="1180" alt="VIP Rogues. John: Events &amp; community. Van: Events &amp; community. DungBeetle: Organised crime support"><img src="05-activities.png" width="1000" height="945" alt="When Rogues Assemble. Monthly ranked wars: Prepare together, follow calls, and communicate your availability. We can talk war pay and numbers when you get in touch.. Weekly chain day: A regular day to work together and earn respect. Our current chain limit is 1,000 hits.. Organised crimes: Work on crimes daily and join OCs promptly. OC payouts reward the work we do together.. Room for your own goals: Between faction activities, train, fly, work on crimes, and build your account. If you need time away, tell the team so we can plan around it."><img src="06-benefits.png" width="1000" height="791" alt="The Rogue Advantage. Ready when we team up: Combat gear available for members, free Xanax for wars, OC payouts, and a faction Discord for advice and company.. Peace-mode travel: +10 travel capacity and 45% lower travel fees.. Peace-mode training: +6% strength and speed gym gains. +5% defense and dexterity gym gains. Travel and training perks shown apply in peace mode and may change when faction upgrades switch."><img src="07-code.png" width="1000" height="904" alt="The Rogue Code. Respect the people: Be kind, respect women and LGBTQ+ members, engage with the community, and follow Torn’s rules.. Show up &amp; contribute: Be active daily, participate in the weekly chain, and earn at least 250 respect per month for the faction.. Keep your account moving: Work on crimes daily, complete Duke missions regularly, and join organised crimes promptly.. Stay ready &amp; stay in touch: Maintain at least $1m in the faction vault. Read newsletters, follow event directions, and communicate your availability."><a href="https://www.torn.com/factions.php?step=profile&amp;ID=54651"><img src="08-join.png" width="1000" height="535" alt="Your story starts here. Sound like your kind of crew? Come introduce yourself. We’ll take it from there. Questions about the expectations? Talk to Ivory or Sativa before applying. One of them will contact you after your application."></a><nav><a href="https://www.torn.com/factions.php?step=profile&amp;ID=54651">apply</a> · <a href="https://www.torn.com/profiles.php?XID=3734945">Ivory</a> · <a href="https://www.torn.com/profiles.php?XID=3832806">Sativa</a></nav></main></html>
