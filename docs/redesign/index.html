<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rogue Assembly — cinematic draft v2</title><style>body{margin:0;background:#08070d;color:#eee7f2;font:18px sans-serif}main{max-width:1000px;margin:auto}img{display:block;width:100%;height:auto}a{color:#bb8ddd}nav{text-align:center;padding:30px}</style><main><img src="01-origin.png?v=68debe3eea" width="1000" height="1126" alt="Rogue Assembly. Rogue Assembly rose from Torn’s shadows, forged from loyalty to all. We built a faction where every member matters. Different stories. One Assembly."><img src="02-culture.png?v=cd05aee513" width="1000" height="1287" alt="A crew worth logging in for. Star, Zaharria, Kaliska, Unriaan, WynterWolf. Torn is a long game. Find a crew you want alongside you for the journey—people who show up, get involved, and give you a reason to log back in. We’re a smaller faction with a core that’s been here for over a year. Ask questions. Share what you know. Help when you can. We’re a 19+ community that actively welcomes women and LGBTQ+ players. The people behind the accounts matter. How you treat them is part of being a Rogue."><img src="03-leadership.png?v=37ceec15c6" width="1000" height="1337" alt="The Assembly’s Leadership. Ivory: Recruitment &amp; Discord administration. Sativa: Communications, recruitment &amp; onboarding. Derlin: Operations, organised crimes &amp; resources. Bee: Community, events &amp; faction identity. Purple: War strategy, coordination &amp; diplomacy"><img src="04-vips.png?v=8380161375" width="1000" height="891" alt="VIP Rogues. John: Events &amp; community. Van: Events &amp; community. DungBeetle: Organised crime support"><img src="05-activities.png?v=0223c746f1" width="1000" height="1246" alt="When Rogues Assemble. Mufasasreign, Morzan, Zykhan, Zeiii, Hellblazer. Monthly ranked wars: Prepare together, follow calls, and communicate availability. Ask us about war pay.. Weekly chain day: Work together and earn respect. Our current chain limit is 1,000 hits.. Organised crimes: Build crime skills, join OCs promptly, and earn OC payouts together.. Your own goals, too: Train, fly, and build your account between events. Need time away? Tell the team."><img src="06-benefits.png?v=8caf9802c1" width="1000" height="1429" alt="The Rogue Advantage. Malachinet, Andrius, ThatWatsonGuy, Simy. Combat gear available for members, free Xanax for wars, OC payouts, and a faction Discord for advice and company.. +10 Travel capacity. −45% Travel fees. +6% Strength &amp; speed gym gains. +5% Defense &amp; dexterity gym gains. Travel and training perks shown apply in peace mode and may change when faction upgrades switch."><img src="07-code.png?v=09062e7edb" width="1000" height="1031" alt="The Rogue Code. Respect the people: Be kind, respect women and LGBTQ+ members, engage with the community, and follow Torn’s rules.. Show up &amp; contribute: Be active daily, participate in the weekly chain, and earn at least 250 respect per month for the faction.. Keep your account moving: Work on crimes daily, complete Duke missions regularly, and join organised crimes promptly.. Stay ready &amp; stay in touch: Maintain at least $1m in the faction vault. Read newsletters, follow event directions, and communicate your availability."><a href="https://www.torn.com/factions.php?step=profile&amp;ID=54651"><img src="08-join.png?v=08bd8a947e" width="1000" height="621" alt="Your story starts here. Sound like your kind of crew? Come introduce yourself. We’ll take it from there. Questions about the expectations? Talk to Ivory or Sativa before applying. One of them will contact you after your application."></a><nav><a href="https://www.torn.com/factions.php?step=profile&amp;ID=54651">apply</a> · <a href="https://www.torn.com/profiles.php?XID=3734945">Ivory</a> · <a href="https://www.torn.com/profiles.php?XID=3832806">Sativa</a></nav></main></html>
